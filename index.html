<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1616"><title>Aura</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1616;--bar:#331e20;--chip:#3b2023;--pl:#2c1a1c;--tx:#e6dcdc;--mut:#a38f91;--dim:#80595c;--red:#c8191f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px Poppins,system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit;background:none;border:0}svg{width:24px;height:24px;fill:currentColor}
#yt{position:fixed;left:0;bottom:0;width:240px;height:135px;opacity:.01;pointer-events:none;z-index:-1}
#rail{position:fixed;left:0;top:0;bottom:80px;width:56px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:0;padding-bottom:6px;z-index:5}
.tab{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:8px;color:var(--dim);font-weight:600;font-size:13px;padding:14px 8px;border-radius:24px;margin:5px 0;white-space:nowrap}
.tab.on{color:#fff;background:#2b2525}.tab i{font-style:normal;transform:rotate(90deg);font-size:13px}
#gear{position:fixed;left:16px;top:calc(env(safe-area-inset-top) + 32px);z-index:6;color:#9b8e8e}
#main{position:fixed;left:58px;right:0;top:0;bottom:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 20px) 0 150px}
h1{margin:12px 14px 4px;text-align:right;font-weight:500;font-size:34px;color:#e8e0e0}
.tools{display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:6px 14px 8px;color:var(--dim)}
.tools .sp{flex:1;display:flex;gap:10px;align-items:center;color:var(--mut)}.tools .on{color:#e8e0e0}
.row{display:flex;align-items:center;gap:12px;padding:6px 14px 6px 4px;height:61px}
.row img,.cv{width:47px;height:47px;border-radius:6px;object-fit:cover;background:var(--chip);flex:none}
.m{flex:1;min-width:0}.m b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m span{display:block;color:var(--mut);font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row em{font-style:normal;color:var(--mut);font-size:12px;font-weight:500}.row.cur b{color:#fff}.row.cur{background:#2a1c1d;border-radius:10px}
h2{font-size:17px;font-weight:600;margin:20px 14px 10px;display:flex;justify-content:space-between;align-items:center}
.more{background:var(--bar);border-radius:18px;padding:6px 14px;font-size:13px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr}.hs{display:grid;grid-auto-flow:column;overflow-x:auto;scrollbar-width:none}
.hs.c3{grid-template-rows:repeat(3,61px);grid-auto-columns:min(78%,280px)}
.mood{border-radius:8px;height:52px;margin:0 6px 7px 0;padding:0 14px;display:flex;align-items:center;font-weight:600;color:#fff;width:230px}
.hs.mo{grid-template-rows:repeat(4,59px);grid-auto-columns:230px;padding-left:6px}
.cards{display:flex;gap:14px;overflow-x:auto;padding:0 14px;scrollbar-width:none}.card{width:95px;flex:none}
.card img{width:95px;height:95px;border-radius:8px;object-fit:cover}.card b{display:block;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card span{font-size:12px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px;padding:6px 8px 0 10px}.tile{text-align:center;font-weight:600;font-size:13px}
.tile div{aspect-ratio:1;background:var(--pl);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:8px}
.nb{background:var(--chip);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;margin-right:auto}
.empty{color:var(--mut);padding:30px 18px;text-align:center;font-size:13px}.av{border-radius:50%!important}
#fab{position:fixed;right:14px;bottom:100px;width:54px;height:54px;border-radius:16px;background:var(--bar);display:flex;align-items:center;justify-content:center;z-index:6}
#mini{position:fixed;left:0;right:0;bottom:0;height:80px;padding:0 14px calc(env(safe-area-inset-bottom) + 0px);background:#2a1a1c;display:flex;align-items:center;gap:12px;z-index:7}
#mini img{width:42px;height:42px;border-radius:5px;object-fit:cover}#mini .m{flex:1}
.ov{position:fixed;inset:0;background:#2b1a1c;z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}.ov.show{display:flex}
#pl{align-items:center}#pl .art{margin-top:50px;width:calc(100% - 56px);max-width:340px;aspect-ratio:1;border-radius:8px;object-fit:cover;background:var(--chip)}
#pl .tt{margin-top:auto;text-align:center;padding:0 24px}#pl .tt b{font-size:22px;font-weight:600;display:block}#pl .tt span{font-size:18px;color:var(--mut);font-weight:500}
.sk{width:calc(100% - 56px);margin-top:26px}.sk input{width:100%;accent-color:#c8191f;height:18px}.sk div{display:flex;justify-content:space-between;font-weight:600;font-size:13px}
.ctl{display:flex;width:100%;max-width:400px;align-items:center;justify-content:space-between;padding:12px 24px 24px}.big{width:112px!important;height:112px!important;border-radius:50%;background:#3a2124;display:flex;align-items:center;justify-content:center;transform:scale(.5);margin:-28px}
.big svg{width:52px;height:52px;transform:scale(2)}
.btm{align-self:stretch;background:#351f21;height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;margin-top:20px;color:#e8dcdc}
#q .list{flex:1;overflow-y:auto;padding-top:10px}#q .row{padding-left:14px}.hnd{color:var(--dim);font-size:22px}
#q .btm{margin:0;gap:10px;padding:0 20px}.pill{background:#3d2427;border-radius:24px;padding:12px 18px;font-size:14px;font-weight:500}
#search{background:var(--bg)}#search .top{display:flex;gap:8px;align-items:center;padding:14px}#search input{flex:1;background:var(--bar);border-radius:24px;padding:12px 18px;outline:0}
#search .list{flex:1;overflow-y:auto}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#e6dcdc;color:#1b1616;padding:9px 16px;border-radius:20px;font-size:13px;font-weight:500;z-index:50;opacity:0;transition:.2s;pointer-events:none;max-width:85%;text-align:center}
#toast.on{opacity:1}
</style></head><body>
<div id="yt"></div>
<button id="gear" aria-label="Impostazioni"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.2h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.9 7.9 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.7h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
<nav id="rail"></nav><main id="main"></main>
<button id="fab"><svg viewBox="0 0 24 24" id="fabi"></svg></button>
<div id="mini"></div>
<section class="ov" id="pl"></section><section class="ov" id="q"></section>
<section class="ov" id="search"><div class="top"><button id="sx"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button><input id="si" placeholder="Cerca o incolla link YouTube" autocomplete="off"></div><div class="list" id="sl"></div></section>
<input type="file" id="lf" accept="audio/*" multiple hidden><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem('aura_'+k))??d}catch{return d}},s:(k,v)=>{try{localStorage.setItem('aura_'+k,JSON.stringify(v))}catch{}}};
const AURA='PL-s-2iEQcaPDhcrse4nbSmardHrlWUQdp'; /* playlist "Aura Sound" letta dall'app originale */
const P={play:'M8 5v14l11-7z',pause:'M6 19h4V5H6zm8-14v14h4V5z',next:'M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z',prev:'M6 6h2v12H6zm3.5 6l8.5 6V6z',shuf:'M10.6 9.2 5.4 4 4 5.4l5.2 5.2zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4zm.3 9.4-1.4 1.4 3.1 3.1-2 2H20v-5.5l-2 2z',srch:'M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z',down:'M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z',que:'M3 13h12v-2H3zm0-4h12V7H3zm0 8h8v-2H3zm13-6v7.5a2.5 2.5 0 1 0 2 2.4V11h3V9h-5z',loop:'M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z',more:'M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm12 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z',heart:'M12 21l-1.5-1.3C5.4 15.4 2 12.3 2 8.5A4.5 4.5 0 0 1 6.5 4c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 15.500 4 4.500 4.500 0 0 1 20 8.500c0 3.800-3.400 6.900-8.500 11.200z'};
const I=(k,f)=>`<svg viewBox="0 0 24 24"${f?` style="fill:${f}"`:''}><path d="${P[k]}"/></svg>`;
let meta=LS.g('meta',{}),ids=LS.g('ids',[]),extra=LS.g('extra',[]),fav=LS.g('fav',[]),hist=LS.g('hist',[]),top=LS.g('top',{}),ups=LS.g('ups',[]),locals=[];
let tab=LS.g('tab','quick'),sort='recent',rev=false,detail=null,queue=[],qi=-1,cur=null,playing=false,loop='queue',shuf=false,ready=false,yt,ctxs={};
const TABS=[['quick','Quick picks','✦'],['disc','Discover','◍'],['songs','Songs','♫'],['pls','Playlists','☰'],['art','Artists','●'],['alb','Albums','◉'],['loc','Local','⇥']];
const lib=()=>[...new Set([...extra,...ids])],tk=id=>meta[id]||{t:'…',a:''},esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cov=id=>meta[id]&&meta[id].cv||`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const fm=s=>isFinite(s)&&s>0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
let sv;const save=()=>{clearTimeout(sv);sv=setTimeout(()=>{LS.s('meta',Object.fromEntries(Object.entries(meta).filter(([k,v])=>!v.src)));LS.s('ids',ids)},600)};
/* ---- metadati via oEmbed (nessun server/istanza) ---- */
const todo=[];let busy=0,rr;
function need(l){l.forEach(id=>{if(!meta[id]&&!todo.includes(id))todo.push(id)});pump()}
function pump(){while(busy<5&&todo.length){const id=todo.shift();busy++;
fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id)).then(r=>r.json()).then(j=>{meta[id]={t:j.title,a:(j.author_name||'').replace(/ - Topic$/,'')}}).catch(()=>{meta[id]={t:'Brano '+id.slice(0,4),a:''}}).finally(()=>{busy--;save();cancelAnimationFrame(rr);rr=requestAnimationFrame(()=>{render();mini();});pump()})}}
/* ---- player YouTube IFrame (senza istanze) ---- */
const au=new Audio();au.onended=()=>nxt(true);au.onplay=()=>{playing=true;mini();pp()};au.onpause=()=>{playing=false;mini();pp()};
const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('yt',{width:240,height:135,playerVars:{listType:'playlist',list:AURA,playsinline:1,controls:0,disablekb:1},events:{onReady:()=>{ready=true;let n=0;const t=setInterval(()=>{const l=yt.getPlaylist&&yt.getPlaylist();if(l&&l.length){ids=l;save();need(ids);render();clearInterval(t)}else if(++n>20)clearInterval(t)},500)},
onStateChange:e=>{if(e.data===0)nxt(true);if(e.data===1||e.data===2){playing=e.data===1;mini();pp()}},onError:()=>{toast('Brano non riproducibile, passo al prossimo');setTimeout(()=>nxt(true),600)}}})};
function playId(id){cur=id;const m=tk(id);hist=[id,...hist.filter(x=>x!==id)].slice(0,100);top[id]=(top[id]||0)+1;LS.s('hist',hist);LS.s('top',top);
if(m.src){try{yt&&yt.pauseVideo()}catch{}au.src=m.src;au.play()}else{au.pause();if(!ready)return toast('Player in caricamento…');yt.loadVideoById(id)}
if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:m.t,artist:m.a,artwork:[{src:cov(id)}]});}
mini();pp();render()}
function start(list,i){queue=list.slice();qi=i;playId(queue[qi])}
function nxt(auto){if(!queue.length)return;if(auto&&loop==='one')return playId(cur);
if(shuf)qi=Math.floor(Math.random()*queue.length);else if(qi+1<queue.length)qi++;else if(loop==='queue'||!auto)qi=0;else{playing=false;return mini()}playId(queue[qi])}
function prv(){if(pos()>3)return seek(0);qi=(qi-1+queue.length)%queue.length;playId(queue[qi])}
const toggle=()=>{if(!cur)return;const m=tk(cur);if(m.src)playing?au.pause():au.play();else if(ready)playing?yt.pauseVideo():yt.playVideo()};
const pos=()=>{try{return tk(cur).src?au.currentTime:yt.getCurrentTime()||0}catch{return 0}},dur=()=>{try{return tk(cur).src?au.duration:yt.getDuration()||0}catch{return 0}};
const seek=x=>{tk(cur).src?au.currentTime=x:yt.seekTo(x,true)};
if('mediaSession'in navigator){const a=(k,f)=>{try{navigator.mediaSession.setActionHandler(k,f)}catch{}};a('play',toggle);a('pause',toggle);a('nexttrack',()=>nxt());a('previoustrack',prv)}
setInterval(()=>{if(!cur)return;const d=dur();if(d&&meta[cur]&&!meta[cur].d){meta[cur].d=d}const r=$('#sk');if(r&&$('#pl').classList.contains('show')&&!r.dragging){r.max=d||1;r.value=pos();$('#t0').textContent=fm(pos())||'0:00';$('#t1').textContent=fm(d)||'0:00'}},400);
/* ---- UI ---- */
function rows(list,ctx,o={}){ctxs[ctx]=list;need(list.slice(0,60));return list.map((id,i)=>{const m=tk(id);return`<div class="row${id===cur?' cur':''}" data-c="${ctx}" data-i="${i}"><img loading="lazy" src="${cov(id)}"><div class="m"><b>${esc(m.t)}</b><span>${esc(m.a)}</span></div><em>${fm(m.d)}</em></div>`}).join('')||'<div class="empty">Nessun brano</div>'}
function tools(n,extraHtml=''){return`<div class="tools">${extraHtml}<div class="sp" data-a="find">${I('srch')}<span>${n} songs</span></div><span class="${sort==='alpha'?'on':''}" data-a="alpha">Aa</span><span class="${sort==='recent'?'on':''}" data-a="recent">◔</span><span data-a="rev">${rev?'↑':'↓'}</span></div>`}
function sorted(l){let a=l.slice();if(sort==='alpha')a.sort((x,y)=>tk(x).t.localeCompare(tk(y).t));if(rev)a.reverse();return a}
const MOODS=[['African','#0b9f0b'],['Bollywood','#7a3fd0'],['Arabic','#e24a00'],['Chill','#a9c3ff'],['Autumn','#5d5d5d'],['Christian','#3ff0ff'],['Blues','#2f7df6'],['Christmas','#0b9f0b'],['Rock','#c0306a'],['Pop','#e0a000'],['Jazz','#6b4b2b'],['Hip-hop','#444eb0']];
function view(){const L=lib();
if(detail){const l=detail.ids();return`<h1>${esc(detail.n)}</h1><div class="tools"><button class="nb" data-a="back">← Indietro</button></div>`+rows(l,'det')}
if(tab==='quick'){const pick=[...new Set([...fav,...hist.slice(0,4),...L.slice().sort(()=>.5-view.r)])].slice(0,8);return`<h1>Quick picks</h1><div class="grid2" style="margin-top:20px">${rows(pick,'qp')}</div><h2>Aura Sound</h2><div class="hs c3">${rows(ids,'au')}</div>`}
if(tab==='disc')return`<h1>Discover</h1><h2 style="margin-top:50px">Moods and genres<button class="more" data-a="more">More</button></h2><div class="hs mo">${MOODS.map(m=>`<div class="mood" data-a="mood" style="background:${m[1]};${m[1]==='#a9c3ff'||m[1]==='#3ff0ff'?'color:#111':''}">${m[0]}</div>`).join('')}</div><h2>Aura Sound<button class="more" data-a="more">More</button></h2><div class="cards">${ids.slice(0,14).map((id,i)=>{need([id]);const m=tk(id);return`<div class="card" data-c="au" data-i="${i}"><img src="${cov(id)}"><b>${esc(m.t)}</b><span>${esc(m.a)}</span></div>`}).join('')}</div>`.replace(/(<div class="cards">.*?<\/div>)$/,'$1')+(ctxs.au=ids,'');
if(tab==='songs')return`<h1>Songs</h1>`+tools(L.length)+rows(sorted(L),'songs');
if(tab==='pls'){const U=ups.map((p,i)=>`<div class="tile" data-a="up" data-i="${i}"><div>♪</div>${esc(p.n)}</div>`).join('');return`<h1>Playlists</h1><div class="tools"><button class="nb" data-a="newpl">New playlist</button></div><div class="tiles"><div class="tile" data-a="pl" data-k="fav"><div style="color:#d33">♥</div>Favorites</div><div class="tile" data-a="pl" data-k="au"><div style="color:#b46cff">✦</div>Aura Sound</div><div class="tile" data-a="pl" data-k="top"><div style="color:#c44">↗</div>My top 50</div><div class="tile" data-a="pl" data-k="hist"><div style="color:#7c6">↺</div>History</div>${U}</div>`}
if(tab==='art'){const g={};L.forEach(id=>{const a=tk(id).a;if(a)(g[a]=g[a]||[]).push(id)});const k=Object.keys(g).sort();ctxs.art=g;return`<h1>Artists</h1><div class="tools"></div>`+(k.map(a=>`<div class="row" data-a="artist" data-n="${esc(a)}"><img class="av" src="${cov(g[a][0])}"><div class="m"><b>${esc(a)}</b><span>${g[a].length} songs</span></div></div>`).join('')||'<div class="empty">Caricamento artisti…</div>')}
if(tab==='alb')return`<h1>Albums</h1><div class="empty">Nessun album: i brani YouTube non hanno metadati album.</div>`;
if(tab==='loc')return`<h1>Local</h1>`+tools(locals.length,'<button class="nb" data-a="addloc">+ Aggiungi file</button>')+rows(locals,'loc')}
view.r=Math.random()-.25;view.r=.25;
function render(){const k=$('#main'),y=k.scrollTop;k.innerHTML=view();k.scrollTop=y;$('#rail').innerHTML=TABS.map(t=>`<button class="tab${t[0]===tab&&!detail?' on':''}" data-t="${t[0]}"><i>${t[2]}</i>${t[1]}</button>`).reverse().join('');$('#fabi').innerHTML=`<path d="${P.srch}"/>`}
function mini(){const m=cur?tk(cur):null;$('#mini').innerHTML=m?`<div style="display:flex;flex:1;align-items:center;gap:12px;min-width:0" data-a="open"><img src="${cov(cur)}"><div class="m"><b>${esc(m.t)}</b><span>${esc(m.a)}</span></div></div><button data-a="tg">${I(playing?'pause':'play')}</button><button data-a="nx">${I('next')}</button>`:`<div class="m"><span>Scegli un brano</span></div>`;
pp()}
function pp(){const el=$('#pl');if(!el.classList.contains('show')||!cur)return;const m=tk(cur),f=fav.includes(cur);
el.innerHTML=`<img class="art" src="${cov(cur)}"><div class="tt"><b>${esc(m.t)}</b><span>${esc(m.a)}</span></div><div class="sk"><input type="range" id="sk" min="0" max="1" step="1" value="0"><div><span id="t0">0:00</span><span id="t1">0:00</span></div></div><div class="ctl"><button data-a="fv">${I('heart',f?'#d33':'#d33').replace('<path','<path'+(f?'':' opacity=".55"'))}</button><button data-a="pv">${I('prev')}</button><button class="big" data-a="tg">${I(playing?'pause':'play')}</button><button data-a="nx">${I('next')}</button><button data-a="lp" style="opacity:${loop==='off'?.4:1}">${I('loop')}</button></div><div class="btm"><button data-a="lp" style="opacity:${loop==='off'?.4:1}">${I('loop')}</button><button data-a="oq">${I('que')}</button><button data-a="mr">${I('more')}</button></div>`;
const r=$('#sk');r.addEventListener('input',()=>{r.dragging=1});r.addEventListener('change',()=>{seek(+r.value);r.dragging=0})}
