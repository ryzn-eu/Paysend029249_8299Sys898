<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Aura">
<meta name="theme-color" content="#0F1224"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Aura</title>
<style>
:root{--bg:#0F1224;--bg2:#171B33;--card:#1B1F4A;--line:#2E3563;--sel:#2A3060;--ac:#7C5CFF;--ac2:#00B8FF;--mut:#A3AACB;--tx:#fff;--g:linear-gradient(135deg,#7C5CFF,#00B8FF);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
[data-theme=light]{--bg:#f4f5fb;--bg2:#fff;--card:#e9ebf7;--line:#d3d7ee;--sel:#dfe3f7;--mut:#5A6190;--tx:#0F1224}
[data-amoled=on]{--bg:#000;--bg2:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px -apple-system,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
#main{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 8px) 14px calc(var(--sb) + 110px)}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:44px}.hd b{font-size:24px;font-weight:800;letter-spacing:-.5px}.hd i{flex:1}.lg{width:34px;height:34px;border-radius:9px;background:#fff}
.tr{display:flex;gap:8px;overflow-x:auto;margin:6px -14px 12px;padding:0 14px;scrollbar-width:none}.tr::-webkit-scrollbar{display:none}
.tr button{flex:none;padding:8px 16px;border-radius:20px;background:var(--card);color:var(--mut);font-weight:600}.tr button.on{background:var(--g);color:#fff}
h3{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin:18px 0 6px}.mut{color:var(--mut)}
#mini{position:fixed;left:8px;right:8px;bottom:calc(8px + var(--sb));background:var(--card);border:1px solid var(--line);border-radius:16px;display:none;align-items:center;gap:10px;padding:8px;z-index:4;overflow:hidden}
#mini img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--sel)}#mini .t{flex:1;min-width:0}
.t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mini .pb{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line)}#mini .pb i{display:block;height:100%;width:0;background:var(--g)}
.ib{font-size:22px;padding:6px 10px}.ib.on{color:var(--ac2)}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px}.row:active,.row.cur{background:var(--sel)}.row img,.row .av{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--sel);flex:none}.row .av{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;border-radius:50%;background:var(--g);color:#fff}.row .t{flex:1;min-width:0}.row.cur .n{color:var(--ac2)}
input.s{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:6px 0 10px;outline:0;font-size:16px}input.s:focus{border-color:var(--ac)}
.bt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 16px;margin:0 6px 10px 0}.bt.ac{background:var(--g);color:#fff;border:0;font-weight:700}.bt.on{border-color:var(--ac2);color:var(--ac2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.chips button{padding:10px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600}
#full{position:fixed;inset:0;background:linear-gradient(#2A3060,var(--bg) 62%);z-index:20;display:none;flex-direction:column;padding:calc(var(--st) + 10px) 24px calc(var(--sb) + 18px)}
#full.open{display:flex}#full .cv{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}#full .cv img{width:min(100%,360px);aspect-ratio:1;object-fit:cover;border-radius:20px;box-shadow:0 14px 44px #0009;background:var(--sel)}
#full h2{margin:14px 0 2px;font-size:21px}input[type=range]{width:100%;accent-color:var(--ac2)}.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.ctl .ib{font-size:26px}.ctl .pl{background:var(--g);color:#fff;width:66px;height:66px;border-radius:50%;font-size:26px}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
#sheet{position:fixed;inset:0;background:#0009;z-index:30;display:none;align-items:flex-end}#sheet.open{display:flex}#sheet div{width:100%;background:var(--bg2);border-radius:20px 20px 0 0;padding:10px 6px calc(var(--sb) + 10px);max-height:75%;overflow:auto}
#sheet h3{margin:8px 14px;text-transform:none;letter-spacing:0}#sheet button{display:block;width:100%;text-align:left;padding:14px;font-size:16px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 10px);transform:translateX(-50%);background:var(--g);color:#fff;padding:8px 16px;border-radius:20px;z-index:40;display:none;font-weight:600}
</style></head><body>
<audio id="a" playsinline preload="auto" x-webkit-airplay="allow"></audio>
<div id="main"></div>
<div id="mini"><img id="mi"><div class="t"><div id="mt" style="font-weight:700"></div><div id="ma" class="mut" style="font-size:13px"></div></div>
<button class="ib" id="mp">▶</button><button class="ib" id="mn">⏭</button><div class="pb"><i id="mb"></i></div></div>
<div id="full"><div style="display:flex;justify-content:space-between"><button class="ib" id="fc">⌄</button><button class="ib" id="fm">⋯</button></div><div class="cv"><img id="fi"></div>
<h2 id="ft"></h2><div id="fa" class="mut"></div>
<div style="margin-top:14px"><input type="range" id="sk" min="0" max="1" step="0.1" value="0"><div class="tm"><span id="cp">0:00</span><span id="du">0:00</span></div></div>
<div class="ctl"><button class="ib" id="sh">🔀</button><button class="ib" id="pv">⏮</button><button class="pl" id="fp">▶</button><button class="ib" id="nx">⏭</button><button class="ib" id="rp">🔁</button></div>
<div class="ctl" style="margin-top:14px"><button class="ib" id="fv">♡</button><input type="range" id="vo" min="0" max="1" step="0.01" value="1" style="width:40%"><button class="ib" id="dl">⬇</button><button class="ib" id="qu">🎵</button></div></div>
<div id="sheet"><div></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),a=$('#a');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,s|0);const m=s/60|0,h=m/60|0,z=n=>String(n).padStart(2,'0');return h?`${h}:${z(m%60)}:${z(s%60)}`:`${m}:${z(s%60)}`};
const LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const th=(id,q='mq')=>`https://i.ytimg.com/vi/${id}/${q}default.jpg`;
/* >>> INDIRIZZO FISSO DEL SERVER: incolla qui il tuo https://... (senza / finale). Lascia '' per farlo chiedere all'app. <<< */
const DEFAULT_BASE='';
let KEY=localStorage.getItem('aura_key')||'',BASE=localStorage.getItem('aura_base')||DEFAULT_BASE;
const url=(p,o={})=>{const u=new URL(p,BASE||location.origin);if(KEY)u.searchParams.set('k',KEY);for(const k in o)u.searchParams.set(k,o[k]);return u.toString()};
function askBase(){const v=prompt('Indirizzo del server Aura (https://…)',BASE);if(!v)return false;BASE=v.trim().replace(/\/+$/,'');localStorage.setItem('aura_base',BASE);return true}
async function api(p,o){let r;
  try{r=await fetch(url(p,o))}catch{if(askBase())return api(p,o);throw 0}
  if(r.status===404&&!BASE&&askBase())return api(p,o);
  if(r.status===401){const k=prompt('Chiave di accesso (AURA_KEY)');if(k){KEY=k;localStorage.setItem('aura_key',k);return api(p,o)}throw 0}
  if(!r.ok)throw 0;return r.json()}
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let Q=LS.g('q',[]),idx=LS.g('idx',-1),shuffle=LS.g('sh',false),repeat=LS.g('rp',0);
let favs=LS.g('favs',[]),hist=LS.g('hist',[]),pls=LS.g('pls',{}),plays=LS.g('plays',{}),cfg=LS.g('cfg',{theme:'dark',amoled:false});
let back=[],view='home',ht='quick',plOpen=null,artOpen=null,results=[],cur={list:[],kind:''},errs=0,resumeAt=0,qp=null,trend=null,sleepAt=0,sleepEnd=false,filt='';
const saveQ=()=>{LS.s('q',Q);LS.s('idx',idx);LS.s('sh',shuffle);LS.s('rp',repeat)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)};
const isFav=id=>favs.some(t=>t.id===id),T=()=>Q[idx];
const slim=t=>({id:t.id,title:t.title,artist:t.artist,dur:t.dur});
const artistOf=t=>(t.artist||'Sconosciuto').replace(/ - Topic$/,'').replace(/VEVO$/i,'').trim()||'Sconosciuto';
function applyTheme(){const d=document.documentElement,t=cfg.theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):cfg.theme;d.dataset.theme=t;d.dataset.amoled=cfg.amoled&&t==='dark'?'on':'off';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(d).getPropertyValue('--bg').trim()||'#0F1224'}

/* ---------- PLAYER (un solo <audio> mai ricreato: indispensabile per l'audio in background su iOS) ---------- */
function load(i,play=true,at=0){
  const t=Q[i];if(!t)return;idx=i;resumeAt=at;
  a.src=url('/api/stream/'+t.id);                      // src sincrono: nessun await tra una traccia e l'altra
  if(play){const p=a.play();p&&p.catch(()=>{})}
  if(play){hist=[slim(t),...hist.filter(x=>x.id!==t.id)].slice(0,200);LS.s('hist',hist);plays[t.id]=(plays[t.id]||0)+1;LS.s('plays',plays)}
  meta(t);saveQ();ui();warm();if(view==='queue')render()
}
function warm(){const n=Q[idx+1];if(n)fetch(url('/api/warm/'+n.id)).catch(()=>{})}
function next(auto){
  const n=Q.length;if(!n)return;
  if(auto&&repeat===2){a.currentTime=0;a.play();return}
  let i;
  if(shuffle&&n>1){back.push(idx);do{i=Math.random()*n|0}while(i===idx)}
  else if(idx+1<n)i=idx+1;else if(repeat===1)i=0;else{if(auto){a.pause();ui()}return}
  load(i)
}
function prev(){
  if(a.currentTime>3||!Q.length){a.currentTime=0;return}
  if(shuffle&&back.length)load(back.pop());else if(idx>0)load(idx-1);else a.currentTime=0
}
const toggle=()=>{if(!T())return;a.paused?a.play().catch(()=>{}):a.pause()};
function stop(){a.pause();a.removeAttribute('src');a.load();idx=-1;saveQ();ui()}
function playNow(list,i){Q=list.map(slim);back=[];load(i)}
function enqueue(t,after){t=slim(t);if(!Q.length){Q=[t];load(0);return}if(after)Q.splice(idx+1,0,t);else Q.push(t);saveQ();warm();toast(after?'Riprodotto dopo':'Aggiunto alla coda');if(view==='queue')render()}
function qRemove(i){
  const was=!a.paused;Q.splice(i,1);
  if(i<idx)idx--;else if(i===idx){if(Q.length)load(Math.min(i,Q.length-1),was);else stop()}
  saveQ();render()}
function qMove(i,d){const j=i+d;if(j<0||j>=Q.length)return;[Q[i],Q[j]]=[Q[j],Q[i]];if(idx===i)idx=j;else if(idx===j)idx=i;saveQ();warm();render()}
a.addEventListener('ended',()=>{if(sleepEnd){sleepEnd=false;ui();return}next(true)});
a.addEventListener('play',()=>{errs=0;ui();if('mediaSession'in navigator)navigator.mediaSession.playbackState='playing'});
a.addEventListener('pause',()=>{ui();if('mediaSession'in navigator)navigator.mediaSession.playbackState='paused'});
a.addEventListener('loadedmetadata',()=>{if(resumeAt){a.currentTime=resumeAt;resumeAt=0}$('#sk').max=a.duration||1;$('#du').textContent=fmt(a.duration)});
a.addEventListener('error',()=>{                         // un tentativo di recupero (URL scaduto), poi salta
  if(!T())return;const t=a.currentTime;
  if(errs++<1){load(idx,true,t);return}
  if(errs<4){toast('Brano non disponibile, salto');next(true)}else{toast('Errore di rete');a.pause()}});
let lastPos=0;
a.addEventListener('timeupdate',()=>{
  const d=a.duration||0,p=a.currentTime;
  if(sleepAt&&Date.now()>=sleepAt){sleepAt=0;a.pause();toast('Timer terminato')}
  $('#mb').style.width=d?p/d*100+'%':'0';
  if(!seeking){$('#sk').value=p;$('#cp').textContent=fmt(p)}
  if(Date.now()-lastPos>4000){lastPos=Date.now();LS.s('pos',p)}
  if('mediaSession'in navigator&&d&&isFinite(d)){try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(p,d),playbackRate:a.playbackRate||1})}catch{}}});

/* ---------- MEDIA SESSION (schermata di blocco / Control Center / AirPods) ---------- */
function meta(t){
  if(!('mediaSession'in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:'Aura',
    artwork:[{src:th(t.id,'mq'),sizes:'320x180',type:'image/jpeg'},{src:th(t.id,'hq'),sizes:'480x360',type:'image/jpeg'}]})}
if('mediaSession'in navigator){
  const ms=navigator.mediaSession;
  // NB: niente seekbackward/seekforward, altrimenti iOS sostituisce i tasti precedente/successivo
  [['play',()=>a.play()],['pause',()=>a.pause()],['stop',()=>a.pause()],['previoustrack',prev],['nexttrack',()=>next(false)],
   ['seekto',d=>{a.currentTime=d.seekTime}]].forEach(([k,f])=>{try{ms.setActionHandler(k,f)}catch{}})}


/* ---------- UI ---------- */
let seeking=false;
function ui(){
  const t=T(),pl=!a.paused&&!!t;
  $('#mini').style.display=t?'flex':'none';
  for(const id of['mp','fp'])$('#'+id).textContent=pl?'⏸':'▶';
  if(t){$('#mi').src=th(t.id);$('#mt').textContent=t.title;$('#ma').textContent=artistOf(t);
    $('#fi').src=th(t.id,'hq');$('#ft').textContent=t.title;$('#fa').textContent=artistOf(t);$('#fv').textContent=isFav(t.id)?'♥':'♡'}
  $('#sh').classList.toggle('on',shuffle);$('#rp').classList.toggle('on',repeat>0);$('#rp').textContent=repeat===2?'🔂':'🔁'}
$('#mp').onclick=$('#fp').onclick=toggle;$('#mn').onclick=$('#nx').onclick=()=>next(false);$('#pv').onclick=prev;
$('#sh').onclick=()=>{shuffle=!shuffle;back=[];saveQ();ui()};
$('#rp').onclick=()=>{repeat=(repeat+1)%3;saveQ();ui()};
$('#mini .t').onclick=$('#mi').onclick=()=>$('#full').classList.add('open');$('#fc').onclick=()=>$('#full').classList.remove('open');
$('#qu').onclick=()=>{$('#full').classList.remove('open');go('queue')};
$('#fv').onclick=()=>T()&&favToggle(T());
$('#dl').onclick=()=>T()&&window.open(url('/api/stream/'+T().id,{dl:1}));
$('#fm').onclick=()=>{const t=T();if(!t)return;sheet(t.title,[['📻 Avvia radio',()=>radio(t)],['⏲ Timer di spegnimento',sleepMenu],['👤 Vai all\'artista',()=>{$('#full').classList.remove('open');artOpen=artistOf(t);view='home';plOpen=null;render()}],['📁 Aggiungi a playlist…',()=>addToPl(t)]])};
const sk=$('#sk');sk.oninput=()=>{seeking=true;$('#cp').textContent=fmt(sk.value)};sk.onchange=()=>{a.currentTime=+sk.value;seeking=false};
const vo=$('#vo');if(IOS)vo.style.visibility='hidden';vo.oninput=()=>a.volume=+vo.value;
function favToggle(t){const i=favs.findIndex(x=>x.id===t.id);if(i>=0)favs.splice(i,1);else favs.unshift(slim(t));LS.s('favs',favs);toast(i>=0?'Rimosso dai preferiti':'Aggiunto ai preferiti');ui();if(plOpen==='#fav'||(view==='home'&&ht==='songs'))render()}
function sheet(title,items){const s=$('#sheet'),d=s.firstElementChild;d.innerHTML=`<h3>${esc(title)}</h3>`;
  items.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{s.classList.remove('open');f()};d.append(b)});
  s.classList.add('open');s.onclick=e=>{if(e.target===s)s.classList.remove('open')}}
function addToPl(t){const n=Object.keys(pls);
  const add=x=>{if(!pls[x].some(y=>y.id===t.id))pls[x].push(slim(t));LS.s('pls',pls);toast('Aggiunto a '+x)};
  sheet('Aggiungi alla playlist',[...n.map(x=>[x,()=>add(x)]),['＋ Nuova playlist…',()=>{const x=(prompt('Nome della playlist')||'').trim();if(x){pls[x]=pls[x]||[];add(x)}}]])}
async function radio(t){toast('Avvio radio…');try{const l=await api('/api/radio/'+t.id);playNow([t,...l.filter(x=>x.id!==t.id)],0)}catch{toast('Radio non disponibile')}}
function sleepMenu(){sheet('Timer di spegnimento',[...[15,30,45,60].map(m=>[m+' minuti',()=>sleep(m)]),['Fino a fine brano',()=>sleep('end')],['Disattiva',()=>sleep(0)]])}
function sleep(m){sleepAt=0;sleepEnd=false;if(m==='end'){sleepEnd=true;toast('Si ferma a fine brano')}else if(m){sleepAt=Date.now()+m*6e4;toast('Timer: '+m+' min')}else toast('Timer disattivato')}
function menu(i){
  const t=cur.list[i];if(!t)return;
  const m=[['▶ Riproduci',()=>cur.kind==='queue'?load(i):playNow(cur.list,i)],['📻 Avvia radio',()=>radio(t)],['⤵ Riproduci dopo',()=>enqueue(t,true)],['➕ Aggiungi alla coda',()=>enqueue(t)],
    [isFav(t.id)?'♥ Rimuovi dai preferiti':'♡ Aggiungi ai preferiti',()=>favToggle(t)],['📁 Aggiungi alla playlist…',()=>addToPl(t)],['👤 Vai all\'artista',()=>{artOpen=artistOf(t);view='home';plOpen=null;render()}],['⬇ Scarica audio',()=>window.open(url('/api/stream/'+t.id,{dl:1}))]];
  if(cur.kind==='queue')m.push(['⬆ Sposta su',()=>qMove(i,-1)],['⬇ Sposta giù',()=>qMove(i,1)],['✖ Rimuovi dalla coda',()=>qRemove(i)]);
  if(cur.kind==='pl')m.push(['✖ Rimuovi dalla playlist',()=>{pls[plOpen].splice(i,1);LS.s('pls',pls);render()}]);
  sheet(t.title,m)}
const row=(t,i)=>`<div class="row${cur.kind==='queue'&&i===idx?' cur':''}" data-i="${i}"><img loading="lazy" src="${th(t.id)}"><div class="t"><div class="n">${esc(t.title)}</div><div class="mut" style="font-size:13px">${esc(artistOf(t))}${t.dur?' · '+fmt(t.dur):''}</div></div><button class="ib more" data-m="${i}">⋯</button></div>`;
const list=(l,k)=>{cur={list:l,kind:k};return l.length?l.map(row).join(''):'<p class="mut">Vuoto.</p>'};
const uniq=l=>{const s=new Set;return l.filter(t=>!s.has(t.id)&&s.add(t.id))};
const allSongs=()=>uniq([...favs,...hist,...Object.values(pls).flat(),...Q]);
const topList=()=>{const m=new Map(allSongs().map(t=>[t.id,t]));return Object.entries(plays).sort((x,y)=>y[1]-x[1]).map(([id])=>m.get(id)).filter(Boolean).slice(0,10)};
const BI={'#fav':['Preferiti','♥',()=>favs],'#top':['I miei top 10','🏆',topList],'#hist':['Cronologia','🕘',()=>hist]};
const plSongs=n=>BI[n]?BI[n][2]():(pls[n]||[]),plTitle=n=>BI[n]?BI[n][0]:n;
const HT=[['quick','Selezione rapida'],['discover','Scopri'],['songs','Brani'],['playlists','Playlist'],['artists','Artisti']];
const MOODS=['Pop','Rock','Hip hop','Chill','Workout','Focus','Latino','Italiana','Elettronica','Jazz','Classica','Indie'];
function go(v){view=v;plOpen=null;artOpen=null;render();scrollTo(0,0)}
function loadQuick(force){if(qp&&!force)return;qp=null;const s=hist[0];
  api(s?'/api/radio/'+s.id:'/api/search',s?{}:{q:'top hits'}).then(l=>qp=l).catch(()=>qp=[]).finally(()=>{if(view==='home'&&ht==='quick'&&!plOpen&&!artOpen)render()})}
function loadTrend(){if(trend)return;api('/api/search',{q:'hit del momento'}).then(l=>trend=l).catch(()=>trend=[]).finally(()=>{if(view==='home'&&ht==='discover')render()})}
function settingsHTML(){const c=cfg;return `<h3>Aspetto</h3>${[['dark','Scuro'],['light','Chiaro'],['system','Sistema']].map(([k,l])=>`<button class="bt${c.theme===k?' on':''}" data-s="theme:${k}">${l}</button>`).join('')}<button class="bt${c.amoled?' on':''}" data-s="amoled">AMOLED</button>
<h3>Riproduzione</h3><button class="bt" data-s="sleep">⏲ Timer di spegnimento</button>
<h3>Dati</h3><button class="bt" data-s="export">Esporta libreria</button><button class="bt" data-s="import">Importa libreria</button><button class="bt" data-s="clrhist">Cancella cronologia</button>
<h3>Server</h3><button class="bt" data-s="base">Indirizzo server</button><button class="bt" data-s="key">Chiave di accesso</button>
<h3>Info</h3><p class="mut">Aura PWA 1.1 · l'audio è fornito dal tuo server Aura.</p>`}
function render(){
  const m=$('#main'),sub=view!=='home'||plOpen||artOpen;
  const ttl=view==='search'?'Cerca':view==='queue'?'In coda':view==='settings'?'Impostazioni':plOpen?plTitle(plOpen):artOpen?artOpen:'Aura';
  let h=`<div class="hd">${sub?'<button class="ib" data-g="back">‹</button>':'<img class="lg" src="logo.png">'}<b>${esc(ttl)}</b><i></i>${view==='search'?'':'<button class="ib" data-g="search">🔎</button>'}<button class="ib" data-g="settings">⚙️</button></div>`;
  if(view==='search')h+=`<input class="s" id="q" type="search" placeholder="Cerca…" enterkeyhint="search" value="${esc(render.q||'')}"><div id="res">${list(results,'s')}</div>`;
  else if(view==='queue')h+=`<span class="mut">${Q.length} brani</span> <button class="bt" data-a="clear" style="margin-left:8px">Svuota</button><button class="bt" data-a="qpl">Salva come playlist</button>${list(Q,'queue')}`;
  else if(view==='settings')h+=settingsHTML();
  else if(plOpen){const u=!BI[plOpen];h+=`<button class="bt ac" data-a="all">▶ Riproduci</button>${u?'<button class="bt" data-a="delpl">Elimina</button>':''}${list(plSongs(plOpen),u?'pl':'p')}`}
  else if(artOpen)h+=`<button class="bt ac" data-a="all">▶ Riproduci</button>${list(allSongs().filter(t=>artistOf(t)===artOpen),'a')}`;
  else{
    h+=`<div class="tr">${HT.map(([k,l])=>`<button data-h="${k}" class="${ht===k?'on':''}">${l}</button>`).join('')}</div>`;
    if(ht==='quick'){loadQuick();h+=qp===null?'<p class="mut">Caricamento…</p>':`<button class="bt ac" data-a="all">▶ Riproduci</button><button class="bt" data-a="refresh">↻ Aggiorna</button>${list(qp,'q')}`}
    else if(ht==='discover'){loadTrend();h+=`<h3>Umori e generi</h3><div class="chips">${MOODS.map(x=>`<button data-mood="${x}">${x}</button>`).join('')}</div><h3>Di tendenza</h3>${trend===null?'<p class="mut">Caricamento…</p>':list(trend,'t')}`}
    else if(ht==='songs'){const l=allSongs().filter(t=>(t.title+t.artist).toLowerCase().includes(filt.toLowerCase()));h+=`<input class="s" id="f" placeholder="Filtra…" value="${esc(filt)}"><div id="fl">${list(l,'sg')}</div>`}
    else if(ht==='playlists'){h+=`<h3>Playlist integrate</h3>${Object.entries(BI).map(([k,[n,ic,f]])=>`<div class="row" data-p="${k}"><div class="av">${ic}</div><div class="t"><div class="n">${n}</div><div class="mut" style="font-size:13px">${f().length} brani</div></div>›</div>`).join('')}<h3>Le tue playlist</h3><button class="bt ac" data-a="newpl">＋ Nuova playlist</button>${Object.keys(pls).map(n=>`<div class="row" data-p="${esc(n)}"><div class="av">${esc(n[0]||'?').toUpperCase()}</div><div class="t"><div class="n">${esc(n)}</div><div class="mut" style="font-size:13px">${pls[n].length} brani</div></div>›</div>`).join('')}`}
    else{const g={};allSongs().forEach(t=>(g[artistOf(t)]??=[]).push(t));h+=Object.keys(g).sort().map(n=>`<div class="row" data-ar="${esc(n)}"><div class="av">${esc(n[0]).toUpperCase()}</div><div class="t"><div class="n">${esc(n)}</div><div class="mut" style="font-size:13px">${g[n].length} brani</div></div>›</div>`).join('')||'<p class="mut">Nessun artista: ascolta qualcosa per iniziare.</p>'}
  }
  m.innerHTML=h;
  if(view==='queue'&&idx>=0){const c=m.querySelector('.cur');c&&c.scrollIntoView({block:'center'})}
  const q=$('#q');if(q){q.onkeydown=e=>{if(e.key==='Enter'){q.blur();doSearch(q.value)}};if(!results.length&&!q.value)q.focus()}
  const f=$('#f');if(f)f.oninput=()=>{filt=f.value;const l=allSongs().filter(t=>(t.title+t.artist).toLowerCase().includes(filt.toLowerCase()));$('#fl').innerHTML=list(l,'sg')}}
async function doSearch(q){
  q=q.trim();if(!q)return;render.q=q;$('#res').innerHTML='<p class="mut">Ricerca…</p>';
  try{results=await api('/api/search',{q});$('#res').innerHTML=list(results,'s')}
  catch{$('#res').innerHTML='<p class="mut">Errore di ricerca. Controlla la connessione al server.</p>'}}
function settingAct(k){
  if(k.startsWith('theme:')){cfg.theme=k.slice(6)}else if(k==='amoled')cfg.amoled=!cfg.amoled;
  else if(k==='sleep')return sleepMenu();
  else if(k==='base'){askBase();return}
  else if(k==='key'){const v=prompt('Chiave di accesso (AURA_KEY)',KEY);if(v!==null){KEY=v;localStorage.setItem('aura_key',v)}return}
  else if(k==='clrhist'){if(confirm('Cancellare la cronologia?')){hist=[];plays={};LS.s('hist',hist);LS.s('plays',plays);qp=null}}
  else if(k==='export'){const j=JSON.stringify({favs,hist,pls,plays});(navigator.share?navigator.share({text:j}):navigator.clipboard.writeText(j)).then(()=>toast('Libreria esportata')).catch(()=>{});return}
  else if(k==='import'){const j=prompt('Incolla qui la libreria esportata');if(!j)return;try{const d=JSON.parse(j);favs=d.favs||[];hist=d.hist||[];pls=d.pls||{};plays=d.plays||{};LS.s('favs',favs);LS.s('hist',hist);LS.s('pls',pls);LS.s('plays',plays);toast('Libreria importata')}catch{toast('Dati non validi')}}
  LS.s('cfg',cfg);applyTheme();render()}
$('#main').onclick=e=>{
  const mo=e.target.closest('[data-m]');if(mo)return menu(+mo.dataset.m);
  const g=e.target.closest('[data-g]');if(g){const k=g.dataset.g;if(k==='back'){if(plOpen||artOpen){plOpen=artOpen=null;render()}else go('home')}else go(k);return}
  const h=e.target.closest('[data-h]');if(h){ht=h.dataset.h;return render()}
  const s=e.target.closest('[data-s]');if(s)return settingAct(s.dataset.s);
  const md=e.target.closest('[data-mood]');if(md){render.q=md.dataset.mood+' music';results=[];view='search';render();doSearch(render.q);return}
  const ac=e.target.closest('[data-a]');
  if(ac){const k=ac.dataset.a;
    if(k==='all'&&cur.list.length)playNow(cur.list,0);
    if(k==='refresh')loadQuick(true),render();
    if(k==='clear'){const t=T();Q=t?[t]:[];idx=t?0:-1;saveQ();render()}
    if(k==='qpl'){const n=(prompt('Nome della playlist')||'').trim();if(n){pls[n]=Q.map(slim);LS.s('pls',pls);toast('Playlist salvata')}}
    if(k==='delpl'&&confirm('Eliminare la playlist?')){delete pls[plOpen];LS.s('pls',pls);plOpen=null;render()}
    if(k==='newpl'){const n=(prompt('Nome della playlist')||'').trim();if(n){pls[n]=pls[n]||[];LS.s('pls',pls);render()}}
    return}
  const p=e.target.closest('[data-p]');if(p){plOpen=p.dataset.p;return render()}
  const ar=e.target.closest('[data-ar]');if(ar){artOpen=ar.dataset.ar;return render()}
  const r=e.target.closest('.row[data-i]');if(r){const i=+r.dataset.i;cur.kind==='queue'?load(i):playNow(cur.list,i)}};

/* ---------- avvio ---------- */
applyTheme();
if(Q.length&&idx>=0&&Q[idx]){load(idx,false,LS.g('pos',0))}else{Q=[];idx=-1}
ui();render();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
